version: '3.8'

services:
  bot:
    build: .
    container_name: weekly-reminder-bot
    restart: unless-stopped
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
    volumes:
      - ./data:/app/data
    # Для разработки можно раскомментировать следующие строки, чтобы монтировать код напрямую
    # volumes:
    #   - ./:/app
    #   - ./data:/app/data